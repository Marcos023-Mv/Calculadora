<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora</title>
  <link rel="stylesheet" href="calculadora.css"/>
</head>
<body>

<div class="calc">
  <div class="display">
    <div id="historico"></div>
    <div id="visor">0</div>
  </div>

  <div class="botoes">
    <button class="limpar" onclick="limpar()">C</button>
    <button class="limpar" onclick="apagar()">⌫</button>
    <button></button>
    <button class="op"     onclick="definirOp('/')">÷</button>

    <button onclick="digito('7')">7</button>
    <button onclick="digito('8')">8</button>
    <button onclick="digito('9')">9</button>
    <button class="op" onclick="definirOp('*')">×</button>

    <button onclick="digito('4')">4</button>
    <button onclick="digito('5')">5</button>
    <button onclick="digito('6')">6</button>
    <button class="op" onclick="definirOp('-')">−</button>

    <button onclick="digito('1')">1</button>
    <button onclick="digito('2')">2</button>
    <button onclick="digito('3')">3</button>
    <button class="op" onclick="definirOp('+')">+</button>

    <button class="zero" onclick="digito('0')">0</button>
    <button onclick="digito('.')">.</button>
    <button class="igual" onclick="calcular()">=</button>
  </div>
</div>

<script src="calculadora.js"></script>
</body>
</html>
